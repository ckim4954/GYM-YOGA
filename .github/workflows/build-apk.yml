
name: Build 89 FITNESS & YOGA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Download repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Extract Android source ZIP
      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="89GYMYOGA-ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
              -not -path "./.git/*" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found!"
            exit 1
          fi

          echo "Using source: $ZIP_FILE"

          mkdir -p extracted_source
          unzip -q -o "$ZIP_FILE" -d extracted_source

          SETTINGS_FILE=$(find extracted_source \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            find extracted_source -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 5. Create debug keystore
      - name: Create debug keystore
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 6. Create temporary Google Services configuration
      - name: Create temporary Google Services config
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/app"

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            cat > "$PROJECT_DIR/app/google-services.json" <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "offline-build-placeholder",
              "storage_bucket": "offline-build-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.gymyogamanager.vnhq"
                  }
                },
                "api_key": [
                  {
                    "current_key": "offline-build-placeholder"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          echo "Google Services configuration prepared."

      # 7. Install Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Building project: $PROJECT_DIR"

          gradle \
            -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 9. Find generated APK
      - name: Find APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated!"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-FITNESS-YOGA-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
