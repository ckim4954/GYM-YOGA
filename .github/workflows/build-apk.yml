
name: Build 89 FITNESS & YOGA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          # 1. Check whether Android source already exists directly.
          find_project() {
            local BASE="$1"
            local SETTINGS

            SETTINGS=$(find "$BASE" \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "*/.git/*" \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              local DIR
              DIR=$(dirname "$SETTINGS")

              if [ -f "$DIR/app/build.gradle.kts" ] || \
                 [ -f "$DIR/app/build.gradle" ]; then
                echo "$DIR"
                return 0
              fi
            fi

            return 1
          }

          if PROJECT_DIR=$(find_project "$WORKSPACE"); then
            echo "Found Android project directly in repository."
          else
            echo "Android project not found directly. Searching ZIP files..."

            mapfile -t ZIP_FILES < <(
              find "$WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*"
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "ERROR: No ZIP file found in repository."
              exit 1
            fi

            EXTRACT_ROOT="$RUNNER_TEMP/android-extracted"
            mkdir -p "$EXTRACT_ROOT"

            FOUND=false
            INDEX=0

            for ZIP_FILE in "${ZIP_FILES[@]}"; do
              INDEX=$((INDEX + 1))
              DEST="$EXTRACT_ROOT/source-$INDEX"

              echo "Extracting: $ZIP_FILE"
              mkdir -p "$DEST"
              unzip -q "$ZIP_FILE" -d "$DEST"

              if PROJECT_DIR=$(find_project "$DEST"); then
                FOUND=true
                echo "Android project found in: $ZIP_FILE"
                break
              fi
            done

            if [ "$FOUND" != "true" ]; then
              echo "ERROR: No valid Android Gradle project found in ZIP files."
              exit 1
            fi
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=================================="
          echo "Android project directory:"
          echo "$PROJECT_DIR"
          echo "=================================="

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_HOME:-}" ] && \
             [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Create debug signing keystore
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-FITNESS-YOGA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
